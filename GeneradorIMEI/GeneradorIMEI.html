<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador IMEI PRO</title>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: black;
            color: #00ff99;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #001a12;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px #00ff99;
            width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        h1 {
            text-shadow: 0 0 15px #00ff99;
        }

        select,
        input,
        button {
            width: 90%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #00291d;
            color: #00ff99;
        }

        button:hover {
            box-shadow: 0 0 15px #00ff99;
        }

        .output {
            padding: 10px;
            background: #00291d;
            border-radius: 10px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #001a12;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Generador IMEI</h1>

    <input type="text" id="username" placeholder="Usuario">

    <button onclick="abrirCarrito()">Comprar Créditos</button>

    <div class="output" id="resultado">---</div>
    <p id="creditosActuales">Créditos: 0</p>
</div>

<!-- MODAL -->
<div class="modal" id="carritoModal">
    <div class="modal-content">
        <h3>Comprar Créditos</h3>

        <select id="seleccionCreditos">
            <option value="">Elegir</option>
            <option value="10">10 Créditos</option>
            <option value="50">50 Créditos</option>
        </select>

        <br><br>

        <button onclick="mostrarQR()">Mostrar QR</button>

        <br><br>

        <button onclick="confirmarPago()">PAGO CONFIRMADO</button>

        <br><br>

        <button onclick="cerrarCarrito()">Cerrar</button>
    </div>
</div>

<script>
let username = "";
let creditos = 0;
let cantidadSeleccionada = 0;

const modal = document.getElementById("carritoModal");
const creditosTxt = document.getElementById("creditosActuales");

document.getElementById("username").addEventListener("input", e=>{
    username = e.target.value;
    cargarCreditos();
});

document.getElementById("seleccionCreditos").addEventListener("change", e=>{
    cantidadSeleccionada = parseInt(e.target.value) || 0;
});

// ===== LOCAL STORAGE =====

function guardarCreditos(valor){
    let data = JSON.parse(localStorage.getItem("users")) || {};

    if(!data[username]) data[username] = 0;

    data[username] += valor;

    if(data[username] < 0) data[username] = 0;

    localStorage.setItem("users", JSON.stringify(data));
}

function cargarCreditos(){
    let data = JSON.parse(localStorage.getItem("users")) || {};
    creditos = data[username] || 0;
    actualizar();
}

function actualizar(){
    creditosTxt.textContent = "Créditos: " + creditos;
}

// ===== UI =====

function abrirCarrito(){
    if(!username){
        Swal.fire('Error','Ingresa usuario','error');
        return;
    }
    modal.style.display = "flex";
}

function cerrarCarrito(){
    modal.style.display = "none";
}

function mostrarQR(){
    Swal.fire('QR','Aquí pondrías tu QR 😎','info');
}

// ===== SWEET ALERT =====

function confirmarPago(){

    if(cantidadSeleccionada <= 0){
        Swal.fire('Error','Selecciona créditos','error');
        return;
    }

    guardarCreditos(cantidadSeleccionada);
    cargarCreditos();

    Swal.fire({
        title: 'Pago confirmado',
        text: 'Tus créditos fueron agregados correctamente',
        icon: 'success',
        confirmButtonText: 'OK',
        background: '#001a12',
        color: '#00ff99',
        confirmButtonColor: '#00ff99'
    });

    cerrarCarrito();
}
</script>

</body>
</html>
